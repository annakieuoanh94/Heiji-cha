<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bán hàng">
<title>Bán hàng</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#0f766e;--ln:#e3e1db;--dg:#b91c1c;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--tx:#f0efe9;--mu:#a3a29b;--ac:#2dd4bf;--ln:#363633;--dg:#f87171;color-scheme:dark}.btn{color:#06201d!important}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:90px}
.tabs{display:flex;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;padding:14px;border:0;background:none;color:var(--mu);font-size:15px;font-weight:600}
.tabs button.on{color:var(--ac);border-bottom:3px solid var(--ac)}
.p{padding:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px;text-align:left;color:var(--tx);font-size:13px;line-height:1.3}
.item b{display:block;margin-bottom:2px}.item span{color:var(--mu);font-size:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:4}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;width:100%;margin-top:8px}
.btn.s{background:var(--card);color:var(--tx)!important;border:1px solid var(--ln)}.btn.d{background:var(--card);color:var(--dg)!important;border:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);gap:8px}
.q button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:18px}.q{display:flex;align-items:center;gap:8px}
.pay{display:flex;gap:8px;margin:10px 0}.pay button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font-size:14px}
.pay button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:15px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:14px}.hide{display:none!important}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
#rc{max-width:80mm;margin:0 auto;background:#fff;color:#000;padding:12px;font:13px/1.45 monospace;border-radius:8px}
#rc .l{display:flex;justify-content:space-between;gap:8px}#rc .c{text-align:center}#rc hr{border:0;border-top:1px dashed #000;margin:8px 0}
@media print{body>*:not(#rcw){display:none!important}#rcw{position:static!important;background:none!important}#rcw>div{max-height:none!important;overflow:visible!important;padding:0!important;background:none!important}.np{display:none!important}#rc{border-radius:0}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px}.chip{flex:1 0 auto;padding:10px 12px;border-radius:20px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:15px;font-weight:600}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}@media(prefers-color-scheme:dark){.chip.on{color:#06201d}}
.orow{display:flex;gap:8px;align-items:flex-start;padding:10px;border-bottom:1px solid var(--ln)}.orow:last-child{border-bottom:0}
</style></head><body>
<div class="tabs"><button id="t0" class="on" onclick="tab(0)">Bán hàng</button><button id="t2" onclick="tab(2)">Thực đơn</button><button id="t1" onclick="tab(1)">Báo cáo</button></div>
<div id="v0" class="p"><div id="dbar"></div><div id="cats"></div><div id="menu" class="grid"></div></div><div id="v1" class="p hide"></div><div id="v2" class="p hide"></div>
<div class="bar" id="bar"><button class="btn" style="margin:0" onclick="openCart()" id="cartBtn">Giỏ hàng trống</button></div>
<div class="sheet hide" id="sheet"><div id="sheetIn"></div></div>
<div class="sheet hide" id="rcw"><div><div id="rc"></div><div class="np" id="rcb"></div></div></div>
<input type="file" id="fi" accept=".json" class="hide"><input type="file" id="qf" accept="image/*" class="hide">
<script>
var PAYS=["Tiền mặt","Chuyển khoản","Ví điện tử"],K="pos2";
var CATS=["Trà sữa","Trà trái cây","Topping"];var D={menu:[["Trà sữa truyền thống",30000,0],["Trà sữa matcha",35000,0],["Trà sữa thái đỏ",32000,0],["Trà đào cam sả",35000,1],["Trà vải",32000,1],["Trà chanh",25000,1],["Trân châu đen",8000,2],["Thạch trái cây",8000,2],["Pudding",10000,2]].map(function(x,i){return{id:"m"+i,n:x[0],p:x[1],c:CATS[x[2]]}}),shop:{n:"",a:"",ph:""},orders:[],lastExport:0};
try{var s=localStorage.getItem(K);if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert("Không lưu được dữ liệu trên máy này.")}}
function $(i){return document.getElementById(i)}
function vnd(n){return Number(n||0).toLocaleString("vi-VN")+"đ"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function day(t){var d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hm(t){var d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function fmt(d){var p=String(d||"").split("-");return p.length==3?p[2]+"/"+p[1]+"/"+p[0]:""}
function dlabel(d){var p=String(d||"").split("-");if(p.length!=3)return"";return["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"][new Date(+p[0],+p[1]-1,+p[2]).getDay()]+", "+fmt(d)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var today0=day(Date.now()),entryDay="",cat="",CL=[""],rd=day(Date.now()),cart=[],pay=0,cur=0,delId=null,eo=null,lastRc=null,mode="merge";
function chkDay(){var t=day(Date.now());if(t!=today0){today0=t;rd=t;drawMenu();if(cur==1)report()}}
function drawDbar(){var td=day(Date.now()),ed=entryDay||td;$("dbar").innerHTML='<div class="'+(entryDay?'card':'')+'" style="'+(entryDay?'padding:8px;border-color:var(--ac);':'')+'display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="mu" style="flex:1">'+(entryDay?'<b style="color:var(--ac)">Đang nhập đơn ngày cũ:</b><br>':'Ngày bán:<br>')+'<b>'+dlabel(ed)+'</b></span><input type="date" value="'+ed+'" max="'+td+'" style="width:auto;margin:0" onchange="setEntry(this.value)">'+(entryDay?'<button class="btn s" style="width:auto;margin:0;padding:8px" onclick="setEntry(\'\')">Về hôm nay</button>':'')+'</div>'}
function setEntry(v){entryDay=(v&&v!=day(Date.now()))?v:"";drawMenu()}
function tab(i){chkDay();cur=i;for(var k=0;k<3;k++){$("v"+k).classList.toggle("hide",k!=i);$("t"+k).classList.toggle("on",k==i)}$("bar").classList.toggle("hide",i!=0);if(i==1)report();if(i==2)editMenu()}
function byId(id){return D.menu.filter(function(m){return m.id==id})[0]}
function drawMenu(){drawDbar();drawCats();var cnt={},c=0,t=0;cart=cart.filter(function(l){return byId(l.id)});cart.forEach(function(l){var m=byId(l.id);cnt[l.id]=(cnt[l.id]||0)+l.q;c+=l.q;t+=l.q*m.p});
var list=D.menu.filter(inCat);$("menu").innerHTML=list.length?list.map(function(m){return '<button class="item" onclick="add(\''+m.id+'\')"><b>'+esc(m.n)+'</b><span>'+vnd(m.p)+(cnt[m.id]?' · x'+cnt[m.id]:'')+'</span></button>'}).join(""):'<div class="mu">Chưa có món trong mục này. Vào tab Thực đơn để thêm.</div>';$("cartBtn").textContent=c?("Giỏ hàng: "+c+" món · "+vnd(t)):"Giỏ hàng trống"}
function allCats(){var cs=CATS.slice();D.menu.forEach(function(m){if(m.c&&cs.indexOf(m.c)<0)cs.push(m.c)});return cs}
function inCat(m){return cat=="_"?!m.c:m.c==cat}
function setCat(i){cat=CL[i];drawMenu()}
function drawCats(){CL=allCats();if(D.menu.some(function(m){return !m.c}))CL.push("_");if(CL.indexOf(cat)<0)cat=CL[0];$("cats").innerHTML='<div class="chips">'+CL.map(function(c,i){return '<button class="chip'+(c==cat?' on':'')+'" onclick="setCat('+i+')">'+(c=="_"?"Khác":esc(c))+'</button>'}).join("")+'</div>'}
function add(id){cart.push({id:id,q:1,note:""});drawMenu()}
function total(){var t=0;cart.forEach(function(l){var m=byId(l.id);if(m)t+=l.q*m.p});return t}
function openCart(){if(!Object.keys(cart).length)return;$("sheet").classList.remove("hide");$("sheetIn").innerHTML="";drawCart()}
function closeSheet(){$("sheet").classList.add("hide")}
function drawCart(){var pn=$("note")?$("note").value:"",pd=($("odate")&&$("odate").value)||entryDay||day(Date.now());var h="<h3>Đơn hàng</h3>";
cart.forEach(function(l,i){var m=byId(l.id);if(!m)return;h+='<div class="card" style="padding:8px"><div class="row" style="border:0;padding:0"><div><b>'+esc(m.n)+'</b> <span class="mu">'+vnd(m.p)+'</span></div><div class="q"><button onclick="chg('+i+',-1)">−</button><b>'+l.q+'</b><button onclick="chg('+i+',1)">+</button></div></div><input value="'+esc(l.note)+'" oninput="cart['+i+'].note=this.value" placeholder="Ghi chú món (ít đường, ít đá...)"></div>'});
h+='<div class="row"><b>Tổng</b><span class="big">'+vnd(total())+'</span></div><div class="mu">Thanh toán qua:</div><div class="pay">'+PAYS.map(function(p,i){return '<button class="'+(i==pay?'on':'')+'" onclick="pay='+i+';drawCart()">'+p+'</button>'}).join("")+'</div>'+qrBlock(total())+'<div class="mu" style="margin-top:8px">Ngày bán (đổi nếu nhập đơn ngày trước):</div><input type="date" id="odate" value="'+pd+'" max="'+day(Date.now())+'" onchange="drawCart()"><div class="mu">'+dlabel(pd)+'</div><input id="note" value="'+esc(pn)+'" placeholder="Ghi chú đơn (tên khách, bàn...)"><button class="btn" onclick="done()">Thanh toán xong</button><button class="btn s" onclick="closeSheet()">Quay lại</button>';$("sheetIn").innerHTML=h}
function qrBlock(sum){if(pay!=1)return "";if(!D.shop.qr)return '<div class="card mu">Chưa có mã QR. Vào tab Thực đơn để thêm ảnh QR của bạn.</div>';return '<div class="card" style="text-align:center"><img src="'+D.shop.qr+'" style="width:100%;max-width:280px;border-radius:8px;background:#fff"><div class="big">'+vnd(sum)+'</div><div class="mu">Khách quét mã và nhập số tiền này</div></div>'}
function chg(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);if(!cart.length)closeSheet();else drawCart();drawMenu()}
function done(){var items=[];cart.forEach(function(l){var m=byId(l.id);if(m)items.push({n:m.n,q:l.q,p:m.p,c:m.c||"",note:(l.note||"").trim()})});if(!items.length)return;
var dd=$("odate").value||day(Date.now()),t=Date.now();if(dd!=day(t)){var q=dd.split("-"),n=new Date();t=new Date(+q[0],+q[1]-1,+q[2],n.getHours(),n.getMinutes()).getTime()}var o={id:uid(),t:t,day:dd,items:items,sum:total(),pay:PAYS[pay],note:$("note").value||""};rd=dd;D.orders.push(o);save();cart=[];closeSheet();drawMenu();showRc(o)}
function rcHtml(o){var S=D.shop,h='<div class="c"><b>'+esc(S.n||"Hóa đơn")+'</b>'+(S.a?'<br>'+esc(S.a):'')+(S.ph?'<br>ĐT: '+esc(S.ph):'')+'</div><hr><div class="c">HÓA ĐƠN<br>'+fmt(o.day)+'</div><hr>';
o.items.forEach(function(x){h+='<div class="l"><span>'+esc(x.n)+' x'+x.q+'</span><span>'+vnd(x.p*x.q)+'</span></div>'+(x.note?'<div style="padding-left:8px">- '+esc(x.note)+'</div>':'')});
return h+'<hr><div class="l"><b>TỔNG</b><b>'+vnd(o.sum)+'</b></div><div class="l"><span>Thanh toán</span><span>'+esc(o.pay)+'</span></div>'+(o.note?'<div>Ghi chú: '+esc(o.note)+'</div>':'')+'<hr><div class="c">Cảm ơn quý khách!</div>'}
function showRc(o){lastRc=o;$("rc").innerHTML=rcHtml(o);$("rcb").innerHTML='<button class="btn" onclick="window.print()">In hóa đơn</button><button class="btn s" onclick="$(\'rcw\').classList.add(\'hide\')">Đóng</button>';$("rcw").classList.remove("hide")}
function dayOrders(){return D.orders.filter(function(o){return o.day==rd}).sort(function(a,b){return a.t-b.t})}
function report(){var L=dayOrders(),tot=0,by={};PAYS.forEach(function(p){by[p]=0});L.forEach(function(o){tot+=o.sum;by[o.pay]=(by[o.pay]||0)+o.sum});
var h='';if(Date.now()-(D.lastExport||0)>6048e5)h+='<div class="card mu">Nhắc: chưa sao lưu dữ liệu trong 7 ngày qua. Kéo xuống bấm "Sao lưu dữ liệu".</div>';
h+='<input type="date" value="'+rd+'" onchange="rd=this.value||rd;report()"><div class="mu">'+dlabel(rd)+'</div>'+dayList()+'<div class="card" style="margin-top:10px"><div class="mu">Doanh thu ngày '+fmt(rd)+'</div><div class="big">'+vnd(tot)+'</div><div class="mu">'+L.length+' đơn</div></div><div class="card">'+PAYS.map(function(p){return '<div class="row"><span>'+p+'</span><b>'+vnd(by[p]||0)+'</b></div>'}).join("")+'</div>';
h+=L.length?'<div class="mu" style="margin:4px 0 6px">Bấm vào đơn để sửa hoặc xóa</div><div class="card" style="padding:0">'+L.map(function(o,n){return '<div class="orow" onclick="eOrder(\''+o.id+'\')"><div class="mu" style="width:66px;flex:none;font-size:12px;line-height:1.4">#'+(n+1)+'<br>'+fmt(o.day)+'</div><div style="flex:1;min-width:0">'+o.items.map(function(x){return '<div><b style="font-size:16px">'+esc(x.n)+'</b>'+(x.note?' <span class="mu" style="font-style:italic">— '+esc(x.note)+'</span>':'')+' <span class="mu">x'+x.q+'</span></div>'}).join('')+(o.note?'<div class="mu" style="font-size:12px">Ghi chú đơn: '+esc(o.note)+'</div>':'')+'</div><div class="mu" style="text-align:right;flex:none;font-size:12px;line-height:1.4">'+esc(o.pay)+'<br>'+vnd(o.sum)+'</div></div>'}).join("")+'</div>':'<div class="mu">Ngày này chưa có đơn.</div>';
h+='<button class="btn" onclick="csv()">Tải báo cáo ngày (CSV, mở bằng Excel)</button><button class="btn s" onclick="backup()">Sao lưu dữ liệu (file)</button><button class="btn s" onclick="mode=\'merge\';$(\'fi\').click()">Gộp đơn từ máy khác (nhập file)</button><button class="btn d" onclick="if(confirm(\'Thay toàn bộ dữ liệu máy này bằng file sao lưu?\')){mode=\'replace\';$(\'fi\').click()}">Khôi phục từ file sao lưu</button>';$("v1").innerHTML=h}
function dayList(){var g={},m=0,mk=rd.slice(0,7);D.orders.forEach(function(o){var x=g[o.day]||(g[o.day]={n:0,s:0});x.n++;x.s+=o.sum;if(o.day.slice(0,7)==mk)m+=o.sum});var ks=Object.keys(g).sort().reverse().slice(0,31);var h='<div class="card" style="margin-top:10px"><div class="row" style="padding-top:0"><b>Tổng tháng '+mk.slice(5)+'/'+mk.slice(0,4)+'</b><b>'+vnd(m)+'</b></div><div class="mu" style="margin:6px 0">Theo ngày (bấm để xem chi tiết)</div>';h+=ks.length?'<div style="max-height:200px;overflow:auto">'+ks.map(function(k){return '<div class="row" style="'+(k==rd?'font-weight:700;color:var(--ac)':'')+'" onclick="rd=\''+k+'\';report()"><span>'+k.slice(8)+'/'+k.slice(5,7)+' · '+g[k].n+' đơn</span><span>'+vnd(g[k].s)+'</span></div>'}).join('')+'</div>':'<div class="mu">Chưa có đơn.</div>';return h+'</div>'}
function rp(id){var o=D.orders.filter(function(x){return x.id==id})[0];if(o)showRc(o)}
function dOrder(id){if(delId!=id){delId=id;report();return}delId=null;D.orders=D.orders.filter(function(o){return o.id!=id});save();report()}
function eOrder(id){var o=D.orders.filter(function(x){return x.id==id})[0];if(!o)return;eo=JSON.parse(JSON.stringify(o));$("sheet").classList.remove("hide");dEdit()}
function eSum(){var s=0;eo.items.forEach(function(x){s+=x.p*x.q});return s}
function dEdit(){var h='<h3>Sửa đơn</h3><div class="mu">Ngày bán:</div><input type="date" value="'+eo.day+'" onchange="eDay(this.value);dEdit()"><div class="mu">'+dlabel(eo.day)+'</div>';eo.items.forEach(function(x,i){h+='<div class="card" style="padding:8px"><div class="row" style="border:0;padding:0"><div><b>'+esc(x.n)+'</b> <span class="mu">'+vnd(x.p)+'</span></div><div class="q"><button onclick="eChg('+i+',-1)">−</button><b>'+x.q+'</b><button onclick="eChg('+i+',1)">+</button></div></div><input value="'+esc(x.note||"")+'" oninput="eo.items['+i+'].note=this.value" placeholder="Ghi chú món"></div>'});
h+='<select onchange="eAdd(this.value)"><option value="">+ Thêm món...</option>'+D.menu.map(function(m){return '<option value="'+m.id+'">'+esc(m.n)+' - '+vnd(m.p)+'</option>'}).join('')+'</select><div class="row"><b>Tổng</b><span class="big">'+vnd(eSum())+'</span></div><div class="pay">'+PAYS.map(function(p,i){return '<button class="'+(p==eo.pay?'on':'')+'" onclick="eo.pay=PAYS['+i+'];dEdit()">'+p+'</button>'}).join('')+'</div><input value="'+esc(eo.note)+'" oninput="eo.note=this.value" placeholder="Ghi chú"><button class="btn" onclick="eSave()">Lưu thay đổi</button><button class="btn s" onclick="closeSheet()">Hủy</button><button class="btn d" onclick="eDel()">Xóa đơn này</button>';$("sheetIn").innerHTML=h}
function eDel(){if(!confirm("Xóa đơn này?"))return;D.orders=D.orders.filter(function(o){return o.id!=eo.id});save();closeSheet();report()}
function eDay(v){if(!v)return;var q=v.split("-"),d=new Date(eo.t);eo.t=new Date(+q[0],+q[1]-1,+q[2],d.getHours(),d.getMinutes()).getTime();eo.day=v}
function eChg(i,d){eo.items[i].q+=d;if(eo.items[i].q<=0)eo.items.splice(i,1);dEdit()}
function eAdd(id){var m=byId(id);if(!m)return;eo.items.push({n:m.n,q:1,p:m.p,c:m.c||"",note:""});dEdit()}
function eSave(){if(!eo.items.length){alert("Đơn hết món. Hãy xóa đơn.");return}eo.sum=eSum();eo.edited=Date.now();rd=eo.day;D.orders=D.orders.map(function(o){return o.id==eo.id?eo:o});save();closeSheet();report()}
function dl(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function csv(){var r=["Ngày,Đơn,Món,Số lượng,Ghi chú món,Thành tiền,Thanh toán,Ghi chú đơn"];dayOrders().forEach(function(o,n){o.items.forEach(function(x){r.push([o.day,n+1,'"'+String(x.n).replace(/"/g,"'")+'"',x.q,'"'+String(x.note||"").replace(/"/g,"'")+'"',x.p*x.q,o.pay,'"'+String(o.note||"").replace(/"/g,"'")+'"'].join(","))})});dl("bao-cao-"+rd+".csv","\ufeff"+r.join("\n"),"text/csv")}
function backup(){D.lastExport=Date.now();save();dl("sao-luu-"+day(Date.now())+".json",JSON.stringify(D),"application/json");report()}
$("fi").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var X=JSON.parse(r.result);if(mode=="replace"){D=Object.assign(D,X)}else{var have={};D.orders.forEach(function(o){have[o.id]=1});var n=0;(X.orders||[]).forEach(function(o){if(!have[o.id]){D.orders.push(o);n++}});alert("Đã gộp thêm "+n+" đơn.")}save();drawMenu();report()}catch(e){alert("File không đúng.")}$("fi").value=""};r.readAsText(f)};
function editMenu(){var S=D.shop,h='<div class="card"><b>Thông tin quán (in trên hóa đơn)</b><input id="sn" placeholder="Tên quán" value="'+esc(S.n)+'"><input id="sa" placeholder="Địa chỉ" value="'+esc(S.a)+'"><input id="sp" placeholder="Số điện thoại" value="'+esc(S.ph)+'"><div class="mu" style="margin-top:10px">Mã QR nhận chuyển khoản (chụp màn hình mã QR trong app ngân hàng):</div>'+(S.qr?'<img src="'+S.qr+'" style="width:140px;display:block;margin:8px 0;border-radius:8px;background:#fff">':'')+'<button class="btn s" onclick="$(\'qf\').click()">'+(S.qr?'Đổi ảnh QR':'Chọn ảnh QR')+'</button>'+(S.qr?'<button class="btn d" onclick="D.shop.qr=\'\';save();editMenu()">Xóa QR</button>':'')+'<button class="btn s" onclick="saveShop()">Lưu thông tin quán</button></div><div class="mu">Món và giá (sửa xong chạm ra ngoài là tự lưu)</div>';
D.menu.forEach(function(m){h+='<div class="card" style="padding:8px"><div class="row" style="border:0;padding:0"><input value="'+esc(m.n)+'" onchange="upd(\''+m.id+'\',\'n\',this.value)" style="flex:2"><input type="number" inputmode="numeric" value="'+m.p+'" onchange="upd(\''+m.id+'\',\'p\',+this.value||0)" style="flex:1"><button class="btn d" style="width:auto;margin:6px 0 0;padding:10px" onclick="delM(\''+m.id+'\')">'+(delId==m.id?'Chắc?':'Xóa')+'</button></div><select onchange="upd(\''+m.id+'\',\'c\',this.value)">'+catOpts(m.c)+'</select></div>'});
$("v2").innerHTML=h+'<button class="btn" onclick="addM()">+ Thêm món</button>'}
function catOpts(c){var h='<option value=""'+(!c?' selected':'')+'>(Chưa phân loại)</option>';allCats().forEach(function(x){h+='<option value="'+esc(x)+'"'+(x==c?' selected':'')+'>'+esc(x)+'</option>'});return h}
function upd(id,f,v){byId(id)[f]=v;save();drawMenu()}
function delM(id){if(delId!=id){delId=id;editMenu();return}delId=null;D.menu=D.menu.filter(function(m){return m.id!=id});save();drawMenu();editMenu()}
function addM(){D.menu.push({id:"m"+uid(),n:"Món mới",p:0,c:(cat&&cat!="_")?cat:""});save();drawMenu();editMenu()}
function saveShop(){D.shop=Object.assign(D.shop,{n:$("sn").value,a:$("sa").value,ph:$("sp").value});save();alert("Đã lưu")}
drawMenu();
$("qf").onchange=function(){var f=this.files[0];if(!f)return;var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){D.shop.n=$("sn").value;D.shop.a=$("sa").value;D.shop.ph=$("sp").value;var k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);D.shop.qr=c.toDataURL("image/png");save();URL.revokeObjectURL(u);$("qf").value="";editMenu()};im.src=u};
document.addEventListener("visibilitychange",function(){if(!document.hidden)chkDay()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script></body></html>
